[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "putsch-orchestration"
version = "0.1.0"
description = "CrewAI + LangGraph orchestration spine for Putsch Group AP (Eingangsrechnung) workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Putsch Group AI Platform" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "crewai>=1.10.1,<2.0",
    "langgraph>=1.0.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "litellm>=1.55.0",
    "dspy-ai>=2.5.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "httpx>=0.27",
    "anyio>=4.4",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6.5",
    "types-psycopg2",
]

[project.scripts]
putsch-orchestration = "putsch_orchestration.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/putsch_orchestration"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "T20", "PT", "SIM", "ARG", "PL", "RUF"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["crewai.*", "litellm.*", "dspy.*", "langgraph.*", "langgraph_checkpoint_postgres.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests across the full graph",
    "chaos: process-crash and resume-from-checkpoint tests",
    "slow: tests that touch the network or a real DB",
]
